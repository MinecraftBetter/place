<a href="m-alerte.dc.html" style="height: 34px; padding: 0 14px; border-radius: 9px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-2)">Mes alertes<span class="count">1</span></a>
</div>
</div>

<div style="padding: 10px 8px 100px; display: flex; flex-direction: column">
<sc-for list="{{items}}" as="e" hint-placeholder-count="8">
<a href="{{e.href}}" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; color: var(--text); background: {{e.bg}}">
<img class="{{e.imgCls}}" src="{{e.img}}" alt="" style="width: 36px; height: 36px">
<span class="fs-small pretty" style="flex-grow: 1"><b>{{e.who}}</b> <span class="t2">{{e.what}}</span> <b>{{e.target}}</b></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0">
<span class="fs-cap t3 mono">{{e.age}}</span>
<sc-if value="{{e.hasCoord}}" hint-placeholder-val="{{false}}"><span class="coord" style="font-size: 11px; padding: 2px 6px">{{e.coord}}</span></sc-if>
</span>
</a>
</sc-for>
</div>
