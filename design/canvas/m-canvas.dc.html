<div class="glass" style="position: absolute; left: 12px; right: 12px; bottom: 88px; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 12px; z-index: 10">
<div style="display: flex; align-items: center; gap: 12px">
<button onClick="{{openDrawer}}" aria-label="Ouvrir la palette" style="appearance: none; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 10px; color: var(--text); font: inherit; cursor: pointer; flex-grow: 1; text-align: left">
<span class="swatch" style="background: {{cur.hex}}; width: 44px; height: 44px"></span>
<span style="display: flex; flex-direction: column"><span class="fs-body b">{{cur.name}}</span><span class="mono fs-cap t3">{{cur.hexU}}</span></span>
</button>
<sc-if value="{{ready}}" hint-placeholder-val="{{true}}">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><rect x="7" y="7" width="10" height="10"></rect></svg>
Poser</button>

<span class="mono">0:05</span></button>

</div>
<sc-if value="{{placed}}" hint-placeholder-val="{{false}}">
<div class="cooldown"><div style="width: 8%"></div></div>
</sc-if>
<div style="display: flex; align-items: center; gap: 8px">
<sc-for list="{{recent}}" as="c" hint-placeholder-count="6">
<button class="swatch swatch-s {{c.sel}}" style="background: {{c.hex}}; width: 36px; height: 36px" aria-label="{{c.name}}" onClick="{{c.pick}}"></button>

<button class="btn btn-sm" onClick="{{openDrawer}}" style="margin-left: auto">Palette</button>
</div>
</div>

<nav class="nav-bottom" aria-label="Navigation principale">
<a class="tab tab-on" href="m-canvas.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><rect x="3" y="3" width="18" height="18"></rect><path d="M9 3v18M15 3v18M3 9h18M3 15h18"></path></svg>Canvas</a>
<a class="tab" href="m-musee.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 9l9-6 9 6M5 10v9M9.5 10v9M14.5 10v9M19 10v9M3 21h18"></path></svg>Musée</a>
<a class="tab" href="m-activite.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg>Activité<span class="count">3</span></a>
<a class="tab" href="m-profil.dc.html"><img class="av av-24" src="/_blob/f341ef9fb793c7257cb54f723280da10" alt="">Profil</a>
</nav>

<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<button class="scrim" onClick="{{closeDrawer}}" aria-label="Fermer la palette" style="border: 0; padding: 0; cursor: pointer"></button>
<div class="sheet anim-feed" style="padding: 0 16px 24px; display: flex; flex-direction: column; gap: 16px">
<div class="grab"></div>
<div style="display: flex; align-items: center; gap: 12px">
<span class="swatch" style="background: {{cur.hex}}; width: 52px; height: 52px; border-radius: 12px"></span>
<div style="display: flex; flex-direction: column; flex-grow: 1"><span class="fs-h3">{{cur.name}}</span><span class="fs-cap t3">30 couleurs · ou un hex libre</span></div>
<button class="btn btn-icon btn-ghost" onClick="{{closeDrawer}}" aria-label="Fermer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, 44px); gap: 5px; justify-content: space-between">
<sc-for list="{{palette}}" as="c" hint-placeholder-count="30">
<button class="swatch {{c.sel}}" style="background: {{c.hex}}" aria-label="{{c.name}}" title="{{c.name}}" onClick="{{c.pick}}"></button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<label class="label" for="hexm">Hex</label>
<input id="hexm" class="input input-mono" value="{{cur.hexU}}" style="flex-grow: 1">
<button class="btn btn-icon" aria-label="Pipette"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M14 4l6 6-3 3-6-6zM11 7l-7 7v3h3l7-7"></path></svg></button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sombre","clair"],"default":"sombre"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 28, open: false, placed: false }; }
  renderVals() {
    const P = [['#000000','noir'],['#333434','gris'],['#d4d7d9','gris clair'],['#ffffff','blanc'],['#6d302f','maron'],['#6d001a','rouge marronâtre'],['#9c451a','maron clair'],['#be0027','rouge'],['#ff2651','rouge clair'],['#ff2d00','rouge'],['#ffa800','orange foncé'],['#ffd623','jaune'],['#fff8b8','beige'],['#7eed38','vert clair'],['#00cc4e','vert'],['#00a344','vert foncé'],['#598d5a','vert foncé foncé'],['#004b6f','bleu sous marin'],['#009eaa','bleu marin'],['#00ccc0','bleu sale de bain'],['#33E9F4','cian'],['#5eb3ff','bleu evian'],['#245aea','bleu ciel'],['#313ac1','bleu ciel violet'],['#1832a4','ciel violet foncé'],['#511e9f','violet'],['#6a5cff','violet clair'],['#b44ac0','violet clair rose'],['#ff63aa','rose'],['#e4abff','rose clair']];
    const s = this.state.sel;
    const mk = (i) => ({ hex: P[i][0], name: P[i][1], sel: i === s ? 'swatch-sel' : '', pick: () => this.setState({ sel: i, open: false, placed: false }) });
    const cur = { hex: P[s][0], name: P[s][1], hexU: P[s][0].toUpperCase() };
    const rows = ['#5eb3ff', '#33e9f4', '#33e9f4', '#245aea', '#1832a4', '#1832a4', '#245aea'];
    const loupe = [];
    for (let i = 0; i < 49; i++) loupe.push({ c: i === 24 && this.state.placed ? cur.hex : (i === 7 ? '#5eb3ff' : rows[Math.floor(i / 7)]) });
    return {
      theme: this.props.theme ?? 'sombre', cur, loupe,
      palette: P.map((_, i) => mk(i)), recent: [28, 29, 27, 11, 0, 3].map(mk),
      open: this.state.open, placed: this.state.placed, ready: !this.state.placed,
      openDrawer: () => this.setState({ open: true }), closeDrawer: () => this.setState({ open: false }),
      place: () => this.setState({ placed: true }), reset: () => this.setState({ placed: false })
    };
  }
}
</script>
</body>
