</helmet>

<img class="px" src="/_blob/e6e62f71b5d85c751836ffeb46aa443e" alt="Canvas, zoom ×6 sur le ciel de Bord de mer" style="position: absolute; width: 6144px; height: 4608px; left: -2632px; top: -1500px">

</div>
</div>

<div class="sheet" style="padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px">
<div class="grab"></div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 10px; background: #5eb3ff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), inset 0 -3px 0 rgba(0,0,0,.18)"></div>

<span class="coord" style="align-self: flex-start">x 470 · y 300</span>
</div>
<a class="btn btn-icon btn-ghost" href="m-canvas.dc.html" aria-label="Fermer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<a class="card-2" href="m-profil.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text)">
<img class="av av-48 av-ring" src="/_blob/f341ef9fb793c7257cb54f723280da10" alt="" style="--ring: #ff63aa; box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 4px #ff63aa">
<div style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px">

<span class="fs-small tac b" style="display: flex; align-items: center; gap: 2px">Profil<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
</a>

<a href="m-oeuvre.dc.html" style="display: flex; align-items: center; gap: 12px; color: var(--text)">
<div class="clip" style="position: relative; width: 44px; height: 44px; border-radius: 8px; background: #fff; flex-shrink: 0">
<img class="px" src="/_blob/e6e62f71b5d85c751836ffeb46aa443e" alt="" style="position: absolute; width: 332px; height: 249px; left: -126px; top: -79px">
</div>
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span class="fs-cap t3">Fait partie de l'œuvre</span>
<span class="fs-small b">Bord de mer</span>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true" style="color: var(--text-3)"><path d="M9 5l7 7-7 7"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 8px">
<span class="fs-over">Historique de ce pixel</span>

<div style="display: flex; align-items: center; gap: 10px" class="fs-small"><span class="dot" style="background: #5eb3ff"></span><span class="pill st-neutre">Œuvre d'origine</span><span class="t3 mono" style="margin-left: auto">13 sept. 2022</span></div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a class="btn" href="m-canvas.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M14 4l6 6-3 3-6-6zM11 7l-7 7v3h3l7-7"></path></svg>Prendre la couleur</a>
<a class="btn" href="m-partage.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"></path></svg>Partager</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sombre","clair"],"default":"sombre"},"$preview":{"width":375,"height":812}}'>

}
</script>
