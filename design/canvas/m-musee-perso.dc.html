<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Musée de Brindille</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="bp.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bp" data-theme="sombre" style="width: 375px; height: 812px; background: linear-gradient(180deg, #0a2340 0%, #103a61 62%, #1c4f7c 70%, #3a2616 70%, #2a1a0f 100%)">

<div class="vagues" style="position: absolute; left: 0; right: 0; top: 566px; height: 4px"></div>
<div style="position: absolute; left: 0; right: 0; top: 570px; bottom: 0; background: repeating-linear-gradient(0deg, transparent 0 22px, rgba(0,0,0,.25) 22px 24px)"></div>
<div style="position: absolute; left: 50%; top: 58px; width: 320px; height: 420px; margin-left: -160px; background: radial-gradient(ellipse 50% 60% at 50% 0%, rgba(255,236,190,.22), transparent 72%); pointer-events: none"></div>
<sc-for list="{{bulles}}" as="p" hint-placeholder-count="12"><span class="part part-monte" style="left: {{p.x}}px; top: {{p.y}}px; background: #cfe8ff; animation-delay: {{p.d}}s"></span></sc-for>

<header style="position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; z-index: 5">
<a class="btn btn-icon glass" href="m-profil.dc.html" aria-label="Retour au profil" style="border-radius: 14px; color: #f3efe6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<img class="av av-32" src="/_blob/f341ef9fb793c7257cb54f723280da10" alt="" style="box-shadow: 0 0 0 2px #5eb3ff">
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span class="pixel b ellip" style="font-size: 17px; color: #f3efe6">Le musée de Brindille</span>
<span class="fs-cap ellip" style="color: #a9c8e6">{{cur.salle}}</span>
</div>
<button class="btn btn-icon glass" onClick="{{toggleSon}}" aria-label="{{sonLabel}}" style="border-radius: 14px; color: #f3efe6">
<sc-if value="{{son}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"></path></svg></sc-if>
<sc-if value="{{muet}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"></path></svg></sc-if>
</button>
</header>

<section style="position: absolute; top: 96px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
<div class="cadre-or anim-feed" style="transform: rotate({{cur.rot}}deg)">
<div class="passe"><div class="clip" style="position: relative; width: {{cur.W}}px; height: {{cur.H}}px; background: #fff">
<img class="px" src="/_blob/e6e62f71b5d85c751836ffeb46aa443e" alt="{{cur.title}}" style="position: absolute; width: {{cur.c.w}}px; height: {{cur.c.h}}px; left: {{cur.c.l}}px; top: {{cur.c.t}}px">
</div></div>
</div>
<div style="display: flex; align-items: center; gap: 14px; width: 330px">
<button class="btn btn-icon glass btn-round" onClick="{{prev}}" aria-label="Œuvre précédente" style="color: #f3efe6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div class="cartel" style="flex-grow: 1; background: #f6f0e4; border-color: #d9ccb0; color: #1c1a16">
<span class="pixel b" style="font-size: 16px">{{cur.title}}</span>
<span class="fs-cap" style="color: #544c40">{{cur.by}}</span>
</div>
<button class="btn btn-icon glass btn-round" onClick="{{next}}" aria-label="Œuvre suivante" style="color: #f3efe6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
<p class="fs-small pretty" style="color: #cfe2f5; font-style: italic; width: 320px; text-align: center; min-height: 40px">{{cur.mot}}</p>
<sc-if value="{{cur.voix}}" hint-placeholder-val="{{true}}">
<button onClick="{{ecouter}}" class="glass" style="border-radius: 999px; padding: 6px 14px 6px 6px; display: flex; align-items: center; gap: 10px; color: #f3efe6; font: inherit; cursor: pointer">
<span style="width: 28px; height: 28px; border-radius: 999px; background: #5eb3ff; color: #06223f; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></span>
<span class="onde" style="color: #a9c8e6; height: 16px"><span style="height: 6px"></span><span style="height: 12px"></span><span style="height: 8px"></span><span style="height: 14px"></span><span style="height: 10px"></span><span style="height: 5px"></span><span style="height: 12px"></span><span style="height: 7px"></span><span style="height: 13px"></span><span style="height: 9px"></span></span>
<span class="fs-cap b">{{ecouteLabel}}</span>
</button>
</sc-if>
</section>

<div style="position: absolute; left: 14px; top: 600px; display: flex; align-items: flex-end; gap: 8px; z-index: 4">
<img class="px anim-bob" src="/_blob/bf33b3cfb8a0e1c819700e44225e8e67" alt="Le guide cowboy" style="width: 36px; height: 62px">
<div class="bulle" style="max-width: 250px; margin-bottom: 30px">{{cur.guide}}</div>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 5">
<div class="glass" style="border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; color: #f3efe6">
<button class="btn btn-icon btn-round" onClick="{{toggleSon}}" aria-label="{{sonLabel}}" style="width: 40px; height: 40px; background: #5eb3ff; color: #06223f; border: 0">
<sc-if value="{{son}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg></sc-if>
<sc-if value="{{muet}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></sc-if>
</button>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span class="fs-small b ellip">Vagues 8-bit</span>
<span class="fs-cap ellip" style="color: #a9c8e6">musique choisie par Brindille · boucle</span>
</div>
<sc-if value="{{son}}" hint-placeholder-val="{{true}}"><div class="eq" style="color: #5eb3ff"><span></span><span></span><span></span><span></span></div></sc-if>
</div>
<div style="display: flex; gap: 10px">
<button class="btn glass" style="flex-grow: 1; color: #f3efe6" onClick="{{signer}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16z"></path></svg>
{{livreLabel}}</button>
<button class="btn btn-icon glass" onClick="{{like}}" aria-label="Coup de cœur pour ce musée" style="color: #f3efe6"><img src="/_blob/6803d1100c44fc8a9af2da77d6e517b2" alt="" class="px {{likeCls}}" style="width: 22px; height: 22px"></button>
</div>
</div>

<div class="rideau rideau-g {{ouvert}}"></div>
<div class="rideau rideau-d {{ouvert}}"></div>
<sc-if value="{{ferme}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; z-index: 41; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 32px; text-align: center">
<div class="cartel" style="background: #f6f0e4; border-color: #c9a45c; color: #1c1a16; padding: 16px 20px; box-shadow: 0 0 0 4px #9c6a1a, 0 16px 40px rgba(0,0,0,.5)">
<span class="fs-over" style="color: #8e5a0c">Bienvenue au</span>
<span class="pixel b" style="font-size: 26px">Musée de Brindille</span>
<span class="fs-small" style="color: #544c40">« Des vagues, un labyrinthe, et mes coups de cœur. Mettez le son ! »</span>
</div>
<button class="btn btn-primary btn-lg btn-px" onClick="{{entrer}}">Entrer</button>
<span class="fs-cap" style="color: #f3d6dc">5 œuvres · 2 salles · 213 visites</span>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { entre: false, i: 0, son: true, like: false, signe: false, ecoute: false }; }
  renderVals() {
    const crop = (z, W, H, pad) => { const s = Math.min(W * pad / z[2], H * pad / z[3]); return { w: Math.round(1024 * s), h: Math.round(768 * s), l: Math.round(-z[0] * s + (W - z[2] * s) / 2), t: Math.round(-z[1] * s + (H - z[3] * s) / 2) }; };
    const O = [
      { title: 'Bord de mer', by: 'Brindille · 13 sept. 2022', mot: '« Ma toute première œuvre. La pizza est arrivée plus tard, je l’adore. »', z: [397, 250, 115, 122], W: 236, H: 250, rot: -1, salle: 'Salle 1 / 2 · Mes œuvres', voix: '0:18', guide: 'Howdy ! Celle-là, Brindille l’a dessinée en un seul jour.' },
      { title: 'Labyrinthe doré', by: 'Brindille & Nyx · 2 mars 2024', mot: '« Une soirée entière à deux sur le même PC. »', z: [257, 505, 64, 88], W: 200, H: 262, rot: 1, salle: 'Salle 1 / 2 · Mes œuvres', guide: 'Un labyrinthe à quatre mains. Tu trouves la sortie ?' },
      { title: 'Pas vraiment', by: 'Zozo42 · 2023', mot: '« Mon coup de cœur : ça me fait rire à chaque fois. »', z: [846, 512, 88, 76], W: 262, H: 226, rot: -1, salle: 'Salle 2 / 2 · Mes coups de cœur', voix: '0:09', guide: 'Salle des coups de cœur : les œuvres des copains.' },
      { title: 'Sapin de Noël', by: 'Mamie Pixel · 2022', mot: '« Le sapin qui revient chaque hiver. »', z: [980, 415, 44, 90], W: 160, H: 262, rot: 1, salle: 'Salle 2 / 2 · Mes coups de cœur', guide: 'Mamie Pixel lui ajoute une guirlande chaque hiver.' },
      { title: 'Dunes au couchant', by: 'Lucie_px · 2022', mot: '« Les couleurs du soir, exactement. »', z: [0, 513, 127, 204], W: 180, H: 262, rot: 0, salle: 'Salle 2 / 2 · Mes coups de cœur', guide: 'Dernière œuvre ! N’oublie pas le livre d’or en sortant.' }
    ];
    const st = this.state, n = O.length, o = O[st.i];
    return {
      cur: { ...o, voix: !!o.voix, c: crop(o.z, o.W, o.H, 0.96) },
      bulles: Array.from({ length: 12 }, (_, k) => ({ x: 10 + (k * 31) % 355, y: 120 + (k * 41) % 420, d: -(k * 0.45).toFixed(1) })),
      ecouteLabel: st.ecoute ? 'Brindille parle… ' + (o.voix || '') : 'Écouter Brindille · ' + (o.voix || ''),
      ecouter: () => this.setState({ ecoute: !st.ecoute }),
      ouvert: st.entre ? 'rideau-ouvert' : '', ferme: !st.entre, entrer: () => this.setState({ entre: true }),
      prev: () => this.setState({ i: (st.i + n - 1) % n, ecoute: false }), next: () => this.setState({ i: (st.i + 1) % n, ecoute: false }),
      son: st.son, muet: !st.son, sonLabel: st.son ? 'Couper la musique' : 'Lancer la musique', toggleSon: () => this.setState({ son: !st.son }),
      like: () => this.setState({ like: !st.like }), likeCls: st.like ? 'anim-pop' : '',
      livreLabel: st.signe ? 'Merci pour ton mot !' : 'Livre d’or · 12 mots', signer: () => this.setState({ signe: true })
    };
  }
}
</script>
</body>
</html>
